<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="fineGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#bfc0c8" stroke-width=".5" opacity=".19"/>
    </pattern>
    <linearGradient id="topRim" x1="335" y1="575" x2="1240" y2="-110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b2b4bf" stop-opacity="0"/>
      <stop offset=".16" stop-color="#c8c8d0" stop-opacity=".15"/>
      <stop offset=".38" stop-color="#f6f7fd" stop-opacity=".53"/>
      <stop offset=".60" stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#b7bac1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="midRim" x1="0" y1="950" x2="1630" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d1d3d9" stop-opacity="0"/>
      <stop offset=".20" stop-color="#d1d3d9" stop-opacity=".15"/>
      <stop offset=".41" stop-color="#f3f4fa" stop-opacity=".96"/>
      <stop offset=".51" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".68" stop-color="#d9dce5" stop-opacity=".50"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lowerRim" x1="160" y1="1210" x2="1630" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8e9f0" stop-opacity="0"/>
      <stop offset=".29" stop-color="#d5d7df" stop-opacity=".16"/>
      <stop offset=".53" stop-color="#f7f8ff" stop-opacity=".72"/>
      <stop offset=".63" stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".84" stop-color="#e7e8ed" stop-opacity=".43"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topBand" x1="500" y1="550" x2="1070" y2="-50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c6c7cf" stop-opacity="0"/>
      <stop offset=".48" stop-color="#c8cbd2" stop-opacity=".22"/>
      <stop offset=".70" stop-color="#c7cad3" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c2c2ca" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="midBand" x1="200" y1="930" x2="1500" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a2a3ad" stop-opacity="0"/>
      <stop offset=".35" stop-color="#c9cbd4" stop-opacity=".17"/>
      <stop offset=".49" stop-color="#f0f1fa" stop-opacity=".23"/>
      <stop offset=".72" stop-color="#a5a6ae" stop-opacity=".10"/>
      <stop offset="1" stop-color="#999ba6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softSpread" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="rimHalo" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="tinyHalo" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <!-- Very quiet etched grid. The light is a hairline, not a grey fog. -->
  <rect width="1600" height="1100" fill="url(#fineGrid)" opacity=".46"/>

  <!-- Raised metallic ribbons, with separately drawn specular edges. -->
  <path d="M335 575C610 482 744 124 1258 -123" fill="none" stroke="url(#topBand)" stroke-width="98" opacity=".8" filter="url(#softSpread)"/>
  <path d="M-110 957C345 833 532 738 800 597S1366 418 1716 271" fill="none" stroke="url(#midBand)" stroke-width="112" opacity=".67" filter="url(#softSpread)"/>
  <path d="M105 1202C500 1054 728 921 962 843S1376 720 1730 629" fill="none" stroke="url(#midBand)" stroke-width="92" opacity=".44" filter="url(#softSpread)"/>

  <!-- Wide directional material lines under the bright edge. -->
  <g fill="none" stroke="#bdc1cb" stroke-width=".65" opacity=".105">
    <path d="M325 578C622 490 759 135 1266 -108"/>
    <path d="M316 589C614 503 760 147 1278 -94"/>
    <path d="M306 602C612 518 766 161 1290 -80"/>
    <path d="M296 613C609 532 775 178 1301 -68"/>
    <path d="M287 628C614 549 785 198 1310 -50"/>
    <path d="M-94 971C357 846 551 757 818 618S1385 434 1730 291"/>
    <path d="M-91 982C363 864 562 776 832 635S1397 452 1740 307"/>
    <path d="M-85 995C372 881 580 790 850 652S1410 469 1752 326"/>
    <path d="M111 1216C501 1069 749 940 985 861S1392 739 1745 649"/>
    <path d="M115 1232C524 1082 772 963 1004 876S1410 759 1765 666"/>
  </g>

  <!-- A narrow, slightly feathered halo immediately behind each white line. -->
  <g fill="none" stroke-width="8" opacity=".74" filter="url(#rimHalo)">
    <path d="M335 575C610 482 744 124 1258 -123" stroke="url(#topRim)"/>
    <path d="M-110 957C345 833 532 738 800 597S1366 418 1716 271" stroke="url(#midRim)"/>
    <path d="M105 1202C500 1054 728 921 962 843S1376 720 1730 629" stroke="url(#lowerRim)"/>
  </g>
  <g fill="none" stroke-width="3.1" opacity=".55" filter="url(#tinyHalo)">
    <path d="M335 575C610 482 744 124 1258 -123" stroke="url(#topRim)"/>
    <path d="M-110 957C345 833 532 738 800 597S1366 418 1716 271" stroke="url(#midRim)"/>
    <path d="M105 1202C500 1054 728 921 962 843S1376 720 1730 629" stroke="url(#lowerRim)"/>
  </g>

  <!-- Optical razor-white glints. No animation and no blue/purple glow. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M335 575C610 482 744 124 1258 -123" stroke="url(#topRim)" stroke-width="1.75"/>
    <path d="M-110 957C345 833 532 738 800 597S1366 418 1716 271" stroke="url(#midRim)" stroke-width="1.9"/>
    <path d="M105 1202C500 1054 728 921 962 843S1376 720 1730 629" stroke="url(#lowerRim)" stroke-width="1.65"/>
    <path d="M353 589C637 494 761 140 1264 -113" stroke="#b6bac5" stroke-width=".62" opacity=".18"/>
    <path d="M-100 969C358 848 542 753 810 614S1377 437 1734 296" stroke="#c7c9d2" stroke-width=".6" opacity=".16"/>
  </g>
</svg>
