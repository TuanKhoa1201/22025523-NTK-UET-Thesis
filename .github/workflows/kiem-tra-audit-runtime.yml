name: Kiem tra kiem toan Codex va bien nhan JavisOS

on:
  push:
    branches:
      - main
    paths:
      - 'v2/baseline/**'
      - 'v2/demo/**'
      - 'v2/triage/**'
      - 'v2/g1_integration/**'
      - 'v2/g1_audit/**'
      - 'v2/g1_runtime/**'
      - '.github/workflows/kiem-tra-audit-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit_runtime:
    name: Kiem thu Codex Audit va JavisOS Runtime
    runs-on: ubuntu-latest

    env:
      G1_EXPECTED_SHA: ${{ github.sha }}
      G1_CHECKOUT: ${{ runner.temp }}/ntk-g1-pinned-main
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Chuan bi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai thu vien kiem thu
        run: python -m pip install PyYAML==6.0.2 typer==0.17.5 rich==15.0.0 pytest==8.4.2

      - name: Tao checkout doc lap tai commit dang kiem thu
        shell: bash
        run: |
          test -n "$GITHUB_SHA"
          git worktree add --detach "$G1_CHECKOUT" "$GITHUB_SHA"
          test "$(git -C "$G1_CHECKOUT" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$G1_CHECKOUT" rev-parse --abbrev-ref HEAD)" = "HEAD"
          test -z "$(git -C "$G1_CHECKOUT" status --porcelain)"

      - name: Kiem thu bo kiem toan Codex
        run: python -X utf8 -B -m unittest discover -s v2/g1_audit -p 'test_*.py' -v

      - name: Kiem thu bien nhan runtime JavisOS
        run: python -X utf8 -B -m pytest -q -p no:cacheprovider v2/g1_runtime/test_g1_runtime.py

      - name: Cong bo gioi han bang chung
        run: |
          echo "Codex: kiem thu gia lap va hop dong auditor."
          echo "JavisOS: kiem thu bien nhan G1-C1 lich su."
          echo "Khong chay OpenGrep hoac Qwen that trong workflow nay."
          echo "Khong cap verdict PASS cho G1-C2."
