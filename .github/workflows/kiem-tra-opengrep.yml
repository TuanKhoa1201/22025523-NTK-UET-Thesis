name: Kiem tra nen tang OpenGrep

on:
  push:
    branches:
      - main
    paths:
      - 'v2/baseline/**'
      - 'v2/triage/**'
      - 'v2/g1_integration/**'
      - 'v2/demo/**'
      - '.github/workflows/kiem-tra-opengrep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    name: Kiem tra ma nguon va bien nhan quet
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Chuan bi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai PyYAML cho kiem thu
        run: python -m pip install PyYAML==6.0.2

      - name: Cai Typer va Rich cho CLI fork
        run: python -m pip install typer==0.17.5 rich==15.0.0

      - name: Chay kiem thu ngoai tuyen
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s v2/baseline/tests -v

      - name: Kiem tra Qwen va hang doi review bang du lieu mo phong
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s v2/triage/tests -v

      - name: Kiem thu tich hop G1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python -X utf8 -B -m unittest discover -s v2/g1_integration/tests -p 'test_*.py' -v

      - name: Ghi ro gioi han kiem thu
        run: |
          echo "Chi kiem thu ma nguon va du lieu mo phong."
          echo "Chua nghiem thu OpenGrep va Ollama chay thuc te."