name: Kiem tra ma nguon he thong do an

on:
  push:
    branches: [main, hoan-thien-tai-lieu-va-trien-khai-20261105]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Kiem tra giao dien
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/22025523-thesis
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/22025523-thesis/package-lock.json
      - name: Cai dat phu thuoc
        run: npm ci
      - name: Chay kiem thu giao dien
        run: node --test tests/*.test.cjs
      - name: Tao ban build
        run: npm run build

  backend:
    name: Kiem tra ma nguon va Java
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cai JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Kiem tra Python va cac phep tinh co dinh
        run: bash scripts/linux/test-backend-stdlib.sh
      - name: Kiem tra cau truc kho ma nguon
        run: python3 scripts/verify-repository.py

  packaging:
    name: Kiem tra tep va tai lieu ban giao
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Kiem tra tep va duong dan
        run: python3 scripts/verify-repository.py
      - name: Kiem tra cu phap PowerShell
        shell: pwsh
        run: ./scripts/windows/verify-syntax.ps1
      - name: Kiem tra cu phap Bash
        run: |
          bash -n scripts/linux/start-backend.sh
          bash -n scripts/linux/stop-backend.sh
          bash -n scripts/linux/check-environment.sh
          bash -n scripts/linux/setup-runtime.sh
          bash -n scripts/linux/test-backend-stdlib.sh
