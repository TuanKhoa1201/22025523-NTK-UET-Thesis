name: Kiem tra ho so nhanh chinh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Kiem tra tai lieu chuyen doi
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Kiem tra cac tep bat buoc
        shell: bash
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/trang-thai-hien-tai.md
          test -f docs/quy-trinh-cap-nhat-github.md

      - name: Kiem tra cau truc tich hop backend va frontend
        shell: bash
        run: |
          test -f apps/22025523-thesis/package.json
          test -f apps/22025523-thesis/package-lock.json
          test -f v2/api/server.py
          test -f v2/api/service.py
          test ! -d backend
          echo "Chi kiem tra cau truc tich hop; khong nghiem thu E2E backend."