name: V2 Integration Quality Gate

on:
  push:
    branches:
      - 'v2/**'
  pull_request:
    branches:
      - 'v2/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-quality-gate:
    name: V2 Policy, Patch, Contracts & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest

      - name: Verify repository policy and JSONL security rules
        run: python3 scripts/verify-repository.py

      - name: Verify upstream patch round-trip and byte integrity
        run: python3 v2/baseline/verify_patch.py

      - name: Run all V2 unit and quality-gate test suites
        run: python3 -m pytest v2/baseline/tests v2/triage/tests v2/evaluation/tests v2/demo/tests -v

      - name: Run V2 data contract and replay quality gate runner (no GPU or live Ollama required)
        run: python3 v2/scripts/run_v2_quality_gate.py --skip-pytest --output-report /tmp/v2_ci_gate_report.json

      - name: Verify PowerShell and Bash script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $psFiles = @(
            Get-ChildItem -LiteralPath "scripts/windows" -Filter "*.ps1" -File
            Get-ChildItem -LiteralPath "v2/scripts" -Filter "*.ps1" -File
            Get-Item -LiteralPath "v2/demo/reproduce_integration_pilot.ps1"
          )
          foreach ($f in $psFiles) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($f.FullName): $($errors[0].Message)"
            }
          }
          Write-Host "PASS: $($psFiles.Count) PowerShell scripts parsed cleanly."
        continue-on-error: false

      - name: Verify V2 Bash scripts syntax
        run: |
          bash -n v2/scripts/setup_server.sh
          bash -n scripts/linux/start-backend.sh
          bash -n scripts/linux/test-backend-stdlib.sh
